<!doctype html><html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="_card.css"><style>
  body{height:240px;}
  .swatches { display:flex; gap:18px; align-items:flex-end; }
  .swatch-item { text-align:center; }
  .chip {
    width: 110px; height: 110px;
    background: var(--bf-red);
    display: block;
  }
  .label {
    margin-top: 10px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .sublabel {
    font-size: 11px;
    color: rgba(26,26,26,0.6);
    margin-top: 2px;
    font-family: ui-monospace, monospace;
  }
  .pill-row {
    display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;
  }
  .pill {
    display:inline-flex; align-items:center;
    padding: 6px 14px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    background:#1A1A1A; color:#F1EBDF;
    border-radius: 999px;
  }
  .pill.cream { background: #F1EBDF; color: #1A1A1A; }
  .pill.red { background: #BD1E1E; color: #F1EBDF; }
  .pill.ox { background: #2A0200; color: #F1EBDF; }
</style></head><body><div class="card">
  <div class="meta" style="margin-bottom:14px">Radii — pill is the default; smaller steps reserved</div>

  <div class="swatches">
    <div class="swatch-item">
      <div class="chip" style="border-radius: 999px;"></div>
      <div class="label">Full · pill</div>
      <div class="sublabel">--radius_full · 999px</div>
    </div>
    <div class="swatch-item">
      <div class="chip" style="border-radius: 28px;"></div>
      <div class="label">Large</div>
      <div class="sublabel">--radius_large · 28px</div>
    </div>
    <div class="swatch-item">
      <div class="chip" style="border-radius: 16px;"></div>
      <div class="label">Medium</div>
      <div class="sublabel">--radius_medium · 16px</div>
    </div>
    <div class="swatch-item">
      <div class="chip" style="border-radius: 8px;"></div>
      <div class="label">Small</div>
      <div class="sublabel">--radius_small · 8px</div>
    </div>
    <div class="swatch-item" style="opacity: 0.55;">
      <div class="chip" style="background: #1A1A1A; border-radius: 0;"></div>
      <div class="label">None · reserved</div>
      <div class="sublabel">--radius_none · 0</div>
    </div>
  </div>

  <div class="pill-row" style="margin-top:18px;">
    <span class="pill">In build</span>
    <span class="pill red">Consented</span>
    <span class="pill ox">Handed over</span>
    <span class="pill cream" style="border:1px solid rgba(26,26,26,0.4)">In design</span>
  </div>
</div></body></html>
