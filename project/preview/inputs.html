<!doctype html><html><head><meta charset="utf-8"><title>Form inputs</title><link rel="stylesheet" href="_card.css"><style>body{height:320px;}</style></head><body><div class="card">
  <div class="meta" style="margin-bottom:14px">Form inputs — underline only, never boxed</div>
  <div style="display:flex;flex-direction:column;gap:18px;max-width:520px">
    <div>
      <label style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:rgba(26,26,26,0.6);display:block;margin-bottom:6px">Name</label>
      <input value="Margaret Holdsworth" style="width:100%;border:0;border-bottom:1px solid #1A1A1A;background:transparent;padding:16px 0;font-family:Inter,sans-serif;font-size:16px;color:#1A1A1A;border-radius:0;outline:none;box-sizing:border-box">
    </div>
    <div>
      <label style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:rgba(26,26,26,0.6);display:block;margin-bottom:6px">Email</label>
      <input placeholder="you@example.co.nz" style="width:100%;border:0;border-bottom:1px solid rgba(26,26,26,0.2);background:transparent;padding:16px 0;font-family:Inter,sans-serif;font-size:16px;color:rgba(26,26,26,0.2);border-radius:0;outline:none;box-sizing:border-box">
    </div>
    <div>
      <label style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:rgba(26,26,26,0.6);display:block;margin-bottom:6px">About the site <span style="opacity:0.5;font-weight:400">· focused</span></label>
      <input value="270 m² corner section, Halswell" style="width:100%;border:0;border-bottom:2px solid #1A1A1A;background:transparent;padding:16px 0;font-family:Inter,sans-serif;font-size:16px;color:#1A1A1A;border-radius:0;outline:none;box-sizing:border-box">
    </div>
  </div>
</div></body></html>
