<!doctype html><html><head><meta charset="utf-8"><title>Secondary buttons</title><link rel="stylesheet" href="_card.css"><style>body{height:200px;}</style></head><body><div class="card">
  <div class="meta" style="margin-bottom:14px">Secondary — transparent, ink text, wash on hover</div>
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <button style="background:transparent;color:#1A1A1A;border:0;font-family:Inter,sans-serif;font-weight:600;font-size:16px;padding:1em 1.5em;border-radius:999px;cursor:pointer">View projects</button>
    <button style="background:rgba(189,30,30,0.10);color:#1A1A1A;border:0;font-family:Inter,sans-serif;font-weight:600;font-size:16px;padding:1em 1.5em;border-radius:999px;cursor:pointer">Hover state</button>
    <button disabled style="background:transparent;color:#1A1A1A;border:0;font-family:Inter,sans-serif;font-weight:600;font-size:16px;padding:1em 1.5em;border-radius:999px;opacity:0.4">Disabled</button>
  </div>
  <div style="margin-top:14px;font-size:13px;color:rgba(26,26,26,0.6);line-height:1.6">No outline tertiary button. The two-button system is intentional.</div>
</div></body></html>
