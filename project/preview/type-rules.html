<!doctype html><html><head><meta charset="utf-8"><title>Type rules</title><link rel="stylesheet" href="_card.css"><style>body{height:260px;}</style></head><body><div class="card">
  <div class="meta" style="margin-bottom:14px">Type rules — defended against drift</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
    <div>
      <div style="font-size:22px;line-height:1.3;letter-spacing:-0.01em;font-weight:700;color:#1A1A1A">Headings can be bold.</div>
      <div style="font-size:14px;line-height:1.6;color:rgba(26,26,26,0.6);margin-top:4px">400 for editorial calm · 600–700 where emphasis earns it.</div>
    </div>
    <div>
      <div style="font-size:22px;line-height:1.3;letter-spacing:-0.01em;font-weight:400;color:#1A1A1A">Body line-height 1.6.</div>
      <div style="font-size:14px;line-height:1.6;color:rgba(26,26,26,0.6);margin-top:4px">Non-negotiable read floor for the audience.</div>
    </div>
    <div>
      <div style="font-size:22px;line-height:1.3;letter-spacing:-0.01em;font-weight:400;color:#1A1A1A">Tracking −0.01em.</div>
      <div style="font-size:14px;line-height:1.6;color:rgba(26,26,26,0.6);margin-top:4px">Headings H0–H4. Considered, not loud.</div>
    </div>
    <div>
      <div style="font-size:11px;line-height:1.3;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:#1A1A1A">Uppercase only for H6.</div>
      <div style="font-size:14px;line-height:1.6;color:rgba(26,26,26,0.6);margin-top:4px">Eyebrow tag with +0.1em tracking.</div>
    </div>
  </div>
</div></body></html>
