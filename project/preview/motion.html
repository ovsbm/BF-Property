<!doctype html><html><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="_card.css"><style>body{height:220px;}</style></head><body><div class="card">
  <div class="meta" style="margin-bottom:14px">Motion — sparingly, never to entertain</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;font-size:14px;line-height:1.6">
    <div style="background:#E8E1D3;padding:16px">
      <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:rgba(26,26,26,0.6);margin-bottom:6px">Fast · 120ms</div>
      <div>Hover colour shifts, link rule changes.</div>
    </div>
    <div style="background:#E8E1D3;padding:16px">
      <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:rgba(26,26,26,0.6);margin-bottom:6px">Base · 180ms</div>
      <div>State changes, button press feedback.</div>
    </div>
    <div style="background:#E8E1D3;padding:16px">
      <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:rgba(26,26,26,0.6);margin-bottom:6px">Slow · 320ms</div>
      <div>Panel slides, drawer reveals.</div>
    </div>
  </div>
  <div style="margin-top:14px;font-size:14px;color:rgba(26,26,26,0.6);line-height:1.6">Easing <span style="color:#1A1A1A;font-weight:600">cubic-bezier(0.4, 0, 0.2, 1)</span>. No bounce. No spring. No parallax. No scroll-reveal.</div>
</div></body></html>
