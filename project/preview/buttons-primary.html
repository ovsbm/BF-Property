<!doctype html><html><head><meta charset="utf-8"><title>Primary buttons</title><link rel="stylesheet" href="_card.css"><style>body{height:200px;}</style></head><body><div class="card">
  <div class="meta" style="margin-bottom:14px">Primary — bright red, pill (999px), padding 1em / 1.5em</div>
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <button style="background:#BD1E1E;color:#F1EBDF;border:0;font-family:Inter,sans-serif;font-weight:600;font-size:16px;padding:1em 1.5em;border-radius:999px;cursor:pointer">Start a conversation</button>
    <button style="background:#D42424;color:#F1EBDF;border:0;font-family:Inter,sans-serif;font-weight:600;font-size:16px;padding:1em 1.5em;border-radius:999px;cursor:pointer">Hover state</button>
    <button style="background:#BD1E1E;color:#F1EBDF;border:0;font-family:Inter,sans-serif;font-weight:600;font-size:16px;padding:1em 1.5em;border-radius:999px;cursor:pointer;outline:2px solid #BD1E1E;outline-offset:2px">Focused</button>
    <button disabled style="background:#BD1E1E;color:#F1EBDF;border:0;font-family:Inter,sans-serif;font-weight:600;font-size:16px;padding:1em 1.5em;border-radius:999px;opacity:0.4">Disabled</button>
  </div>
  <div style="margin-top:14px;font-size:13px;color:rgba(26,26,26,0.6);line-height:1.6">Default CTA copy: <strong style="font-weight:600;color:#1A1A1A">Start a conversation</strong> · <strong style="font-weight:600;color:#1A1A1A">Get in touch</strong> · <strong style="font-weight:600;color:#1A1A1A">Request information</strong></div>
</div></body></html>
