<!doctype html><html><head><meta charset="utf-8"><title>Iconography</title><link rel="stylesheet" href="_card.css"><style>body{height:220px;}</style></head><body><div class="card">
  <div class="meta" style="margin-bottom:14px">Iconography — Lucide @ 1.5px stroke (substitution, please confirm)</div>
  <div style="display:flex;gap:24px;align-items:center;color:#1A1A1A">
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <i data-lucide="arrow-right" style="width:24px;height:24px"></i>
        <div style="font-size:11px;color:rgba(26,26,26,0.6);letter-spacing:0.04em">arrow-right</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <i data-lucide="map-pin" style="width:24px;height:24px"></i>
        <div style="font-size:11px;color:rgba(26,26,26,0.6);letter-spacing:0.04em">map-pin</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <i data-lucide="phone" style="width:24px;height:24px"></i>
        <div style="font-size:11px;color:rgba(26,26,26,0.6);letter-spacing:0.04em">phone</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <i data-lucide="mail" style="width:24px;height:24px"></i>
        <div style="font-size:11px;color:rgba(26,26,26,0.6);letter-spacing:0.04em">mail</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <i data-lucide="file-text" style="width:24px;height:24px"></i>
        <div style="font-size:11px;color:rgba(26,26,26,0.6);letter-spacing:0.04em">file-text</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <i data-lucide="calendar" style="width:24px;height:24px"></i>
        <div style="font-size:11px;color:rgba(26,26,26,0.6);letter-spacing:0.04em">calendar</div>
      </div>
    
  </div>
  <div style="margin-top:18px;font-size:13px;color:rgba(26,26,26,0.6);line-height:1.6">Ink colour. Default 20px. No fill. No emoji. No unicode glyphs.</div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</div></body></html>
